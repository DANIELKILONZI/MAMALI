# =============================================================================
# MAMALI Nginx Configuration
# Place this file at: /etc/nginx/sites-available/mamali
# Then: ln -s /etc/nginx/sites-available/mamali /etc/nginx/sites-enabled/mamali
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=mamali_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=mamali_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mamali_static:10m rate=100r/s;

# Upstream servers
upstream mamali_backend {
  server 127.0.0.1:5000;
  keepalive 32;
}

upstream mamali_frontend {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream mamali_admin {
  server 127.0.0.1:3001;
  keepalive 32;
}

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name mamali.example.com api.mamali.example.com admin.mamali.example.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── Customer Storefront ──────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name mamali.example.com;

  # SSL — managed by Certbot
  ssl_certificate /etc/letsencrypt/live/mamali.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mamali.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Static assets from Next.js
  location /_next/static/ {
    limit_req zone=mamali_static burst=50 nodelay;
    proxy_pass http://mamali_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    limit_req zone=mamali_api burst=20 nodelay;
    proxy_pass http://mamali_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }
}

# ─── Admin Dashboard ──────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.mamali.example.com;

  ssl_certificate /etc/letsencrypt/live/mamali.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mamali.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  # Restrict admin to known office IPs in production (uncomment and set IPs)
  # allow 203.0.113.0/24;   # Office IP range
  # deny all;

  location /_next/static/ {
    proxy_pass http://mamali_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    limit_req zone=mamali_api burst=10 nodelay;
    proxy_pass http://mamali_admin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}

# ─── Backend API ──────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.mamali.example.com;

  ssl_certificate /etc/letsencrypt/live/mamali.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mamali.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  # M-Pesa callback — no rate limit (Safaricom must reach this)
  location /api/payments/callback {
    proxy_pass http://mamali_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Auth endpoints — strict rate limiting
  location ~ ^/api/auth/(login|refresh) {
    limit_req zone=mamali_auth burst=3 nodelay;
    proxy_pass http://mamali_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # General API
  location /api/ {
    limit_req zone=mamali_api burst=30 nodelay;
    proxy_pass http://mamali_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 10m;
  }
}
